apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchandise-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merch-site
  template:
    metadata:
      labels:
        app: merch-site
    spec:
      containers:
      - name: merch-container
        image: merch-company-app:latest  # Must match your docker build name
        imagePullPolicy: Never           # Tells K8s to use your local image
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: merch-service
spec:
  type: NodePort
  selector:
    app: merch-site
  ports:
    - port: 80git add Dockerfile
      targetPort: 80
      nodePort: 30001
