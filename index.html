<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Merchandise Store</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f4f4;
        }
        header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .product {
            background: white;
            padding: 15px;
            width: 250px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        .product h3 {
            margin: 0;
        }
        .price {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>ABC Merchandise Company</h1>
    <p>Your one-stop shop for clothing, accessories & gadgets</p>
</header>

<div class="container">
    <h2>Our Products</h2>

    <div class="products">

        <div class="product">
            <h3>T-Shirt</h3>
            <p>Comfortable cotton t-shirt</p>
            <p class="price">₹500</p>
        </div>

        <div class="product">
            <h3>Smart Watch</h3>
            <p>Track your fitness and health</p>
            <p class="price">₹2500</p>
        </div>

        <div class="product">
            <h3>Backpack</h3>
            <p>Stylish and durable bag</p>
            <p class="price">₹1200</p>
        </div>

        <div class="product">
            <h3>Sunglasses</h3>
            <p>UV protected stylish glasses</p>
            <p class="price">₹800</p>
        </div>

    </div>
</div>

</body>
</html>
